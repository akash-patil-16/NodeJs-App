version: "3.8"

services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Akash
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: Akash
      ME_CONFIG_MONGODB_URL: "mongodb://admin:Akash@mongo:27017/"

  myapp:
    build: .
    container_name: myapp
    ports:
      - "5050:5050"
    environment:
      MONGO_DB_USERNAME: admin
      MONGO_DB_PASSWORD: Akash
      MONGO_DB_HOST: mongo
      MONGO_URL: "mongodb://admin:Akash@mongo:27017/"
    depends_on:
      - mongo    

volumes:
  mongo-data:
    driver: local